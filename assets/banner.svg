<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shield-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 50px;
      fill: url(#text-gradient);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
    }
    
    /* Animations */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .floating-element {
      animation: float 6s ease-in-out infinite;
    }

    .pulsing-glow {
      animation: pulse 4s ease-in-out infinite;
      transform-origin: center;
    }

    .animated-line {
      stroke-dasharray: 8 6;
      animation: dash 3s linear infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-gradient)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Background Animated Security Circles & Glows (Behind text) -->
  <circle cx="1020" cy="190" r="140" fill="#6366f1" opacity="0.12" class="pulsing-glow" />
  <circle cx="1020" cy="190" r="90" fill="#38bdf8" opacity="0.15" class="pulsing-glow" />
  <circle cx="150" cy="80" r="100" fill="#0284c7" opacity="0.08" class="pulsing-glow" />

  <!-- Connecting Dynamic Network Flow Lines (Right Side Background Graphic) -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" fill="none">
    <path d="M 820 190 Q 920 120 1020 190 T 1120 190" class="animated-line" />
    <path d="M 820 190 Q 920 260 1020 190 T 1120 190" class="animated-line" />
  </g>

  <!-- Floating Graphical Cards (Right Side Visuals) -->
  <g class="floating-element" filter="url(#shadow)">
    <!-- Security Shield Icon Container -->
    <g transform="translate(970, 120)">
      <circle cx="50" cy="50" r="46" fill="#1e293b" stroke="url(#shield-gradient)" stroke-width="3" />
      <path d="M 50 25 L 75 36 V 55 C 75 70 64 83 50 88 C 36 83 25 70 25 55 V 36 L 50 25 Z" 
            fill="url(#shield-gradient)" filter="url(#glow-filter)"/>
      <path d="M 43 53 L 48 58 L 59 45" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Dynamic Protocol Pills -->
    <!-- DMARC Pill -->
    <g transform="translate(810, 85)">
      <rect width="130" height="38" rx="19" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <circle cx="22" cy="19" r="6" fill="#10b981"/>
      <text x="36" y="24" class="badge-text" fill="#10b981">DMARC p=reject</text>
    </g>

    <!-- SPF Pill -->
    <g transform="translate(1030, 75)">
      <rect width="105" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="20" cy="18" r="5" fill="#38bdf8"/>
      <text x="32" y="23" class="badge-text" fill="#38bdf8">SPF Pass</text>
    </g>

    <!-- DKIM Pill -->
    <g transform="translate(820, 260)">
      <rect width="115" height="36" rx="18" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <circle cx="20" cy="18" r="5" fill="#818cf8"/>
      <text x="32" y="23" class="badge-text" fill="#818cf8">DKIM Valid</text>
    </g>

    <!-- BIMI Pill -->
    <g transform="translate(1010, 270)">
      <rect width="100" height="36" rx="18" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
      <circle cx="20" cy="18" r="5" fill="#c084fc"/>
      <text x="32" y="23" class="badge-text" fill="#c084fc">BIMI Ready</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT CONTENT (Always crisp & on top of background graphics) -->
  <g transform="translate(70, 0)">
    <!-- Top Tag Badge -->
    <g transform="translate(0, 75)">
      <rect width="270" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="16" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="0.5">
        🛡️ EMAIL AUTHENTICATION ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title" filter="url(#shadow)">
      Awesome DMARC Management
    </text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="215" class="subtitle">
      Curated Directory of Top SaaS Platforms &amp; Open-Source Projects
    </text>

    <!-- Subtitle Line 2 -->
    <text x="0" y="245" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">
      DMARC Aggregate Reporting • SPF/DKIM Alignment • Anti-Spoofing &amp; BIMI Enforcement
    </text>

    <!-- Key Statistics / Feature Badges Bar -->
    <g transform="translate(0, 285)">
      <!-- Item 1 -->
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
        ✓ 10 Top SaaS Vendors
      </text>
      <text x="175" y="20" font-family="system-ui, sans-serif" font-size="14" fill="#475569">•</text>

      <!-- Item 2 -->
      <text x="200" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#818cf8">
        ✓ 15+ Open-Source Parsers
      </text>
      <text x="400" y="20" font-family="system-ui, sans-serif" font-size="14" fill="#475569">•</text>

      <!-- Item 3 -->
      <text x="425" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#c084fc">
        ✓ Live Pricing &amp; Stars Data
      </text>
    </g>
  </g>
</svg>
